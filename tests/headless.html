<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sim checks</title>
<style>body { font: 13px/1.4 ui-monospace, monospace; background: #fff; color: #111; padding: 16px; } .fail { color: #b00; } .pass { color: #070; }</style>
</head>
<body>
<h1>Simulation checks</h1>
<pre id="out">running…</pre>
<script type="module">
import { World } from "../src/sim/world.js";
import { Missile } from "../src/sim/missile.js";
import { DEG, offset, range3D_m } from "../src/sim/geo.js";
import { blastOverpressure, damageFactor } from "../src/sim/damage.js";

const [data, atmo, scenario] = await Promise.all([
  fetch("../data/gcb-units.json").then((r) => r.json()),
  fetch("../data/atmosphere.csv").then((r) => r.text()),
  fetch("../scenarios/norwegian-sea.json").then((r) => r.json()),
]);

const lines = [];
const results = { checks: [] };
function check(name, ok, detail = "") {
  results.checks.push({ name, ok, detail });
  lines.push(`<span class="${ok ? "pass" : "fail"}">${ok ? "PASS" : "FAIL"}</span> ${name} ${detail}`);
}

// 1. Radar horizon: SPY-1D vs a ship should see ~30 km but not 60 km
{
  const w = new World(data, atmo, { seed: 1, units: [
    { side: "blue", class: "Arleigh Burke DDGHM", lat_deg: 60, lon_deg: 0, heading_deg: 0, speed_kts: 0 },
    { side: "red", class: "Pr 956 Sarych", lat_deg: 60 + 25 / 111.2, lon_deg: 0, heading_deg: 90, speed_kts: 0 },
  ] });
  const [b, r] = w.ships();
  const spy = b.radars.find((x) => x.db.name === "SPY-1D");
  const at25 = spy.canDetect(r, false);
  r.lat = (60 + 60 / 111.2) * DEG;
  const at60 = spy.canDetect(r, false);
  check("SPY-1D detects a destroyer at 25 km, not at 60 km (radar horizon)", at25 && !at60, `25km=${at25} 60km=${at60}`);
}

// 2. Harpoon flight: reaches ~Mach 0.85 and holds sea-skimming altitude
{
  const w = new World(data, atmo, { seed: 2, ai: { red: { autoDefend: false } }, units: [
    { side: "blue", class: "Arleigh Burke DDGHM", lat_deg: 60, lon_deg: 0, heading_deg: 0, speed_kts: 0 },
    { side: "red", class: "Pr 956 Sarych", lat_deg: 60 + 80 / 111.2, lon_deg: 0, heading_deg: 90, speed_kts: 0 },
  ] });
  const [b, r] = w.ships();
  w.updateTrack("blue", r, "test");
  const idx = b.launchers.findIndex((l) => l.item.includes("Harpoon"));
  const res = w.launch(b, idx, r.id);
  const m = res.missile;
  let maxAlt = 0, speedAt60 = 0, outcome = "flying";
  for (let i = 0; i < 6000 && !m.dead; i++) {
    w.step(0.1);
    if (w.t > 30) maxAlt = Math.max(maxAlt, m.alt);
    if (Math.abs(w.t - 60) < 0.05) speedAt60 = m.speed_mps;
  }
  outcome = r.damage > 0 ? `hit, target damage ${(r.damage * 100).toFixed(0)}%` : "no damage";
  check("Harpoon launches", res.ok, res.reason || "");
  check("Harpoon cruise speed 250-300 m/s", speedAt60 > 250 && speedAt60 < 300, `${speedAt60.toFixed(0)} m/s`);
  check("Harpoon stays below its 800 m terminal pop-up", maxAlt < 900, `max alt after 30 s ${maxAlt.toFixed(0)} m`);
  check("Harpoon reaches stationary target at 80 km", r.damage > 0, outcome + ` t=${w.t.toFixed(0)}s`);
}

// 3. SAM intercept: SM-2 vs an inbound SS-N-22
{
  let kills = 0, n = 20;
  for (let s = 0; s < n; s++) {
    const w = new World(data, atmo, { seed: 100 + s, ai: { blue: { autoDefend: true }, red: {} }, units: [
      { side: "blue", class: "Arleigh Burke DDGHM", lat_deg: 60, lon_deg: 0, heading_deg: 0, speed_kts: 15 },
      { side: "red", class: "Pr 956 Sarych", lat_deg: 60 + 70 / 111.2, lon_deg: 0, heading_deg: 90, speed_kts: 0 },
    ] });
    const [b, r] = w.ships();
    w.updateTrack("red", b, "test");
    const idx = r.launchers.findIndex((l) => l.item.includes("Moskit"));
    const res = w.launch(r, idx, b.id);
    for (let i = 0; i < 3000 && !res.missile.dead; i++) w.step(0.1);
    if (b.damage === 0) kills++;
  }
  check("Burke survives a single SS-N-22 most of the time", kills >= n * 0.5, `${kills}/${n} defended`);
}

// 4. Damage tables
check("Blast overpressure falls with range", blastOverpressure(10, 100) > blastOverpressure(50, 100));
check("Damage table interpolates", Math.abs(damageFactor([[0, 0], [10, 1]], 5) - 0.5) < 1e-6);

// 5. Full scenario, blue fires Harpoons at first contact report
{
  const w = new World(data, atmo, scenario);
  let ordered = false;
  for (let i = 0; i < 36000 && !w.over; i++) {
    w.step(0.1);
    if (!ordered && w.tracks.blue.size >= 2) {
      const [ddg, ffg] = w.ships("blue");
      const targets = [...w.tracks.blue.values()].filter((t) => t.kind === "ship");
      w.orderSalvo(ddg, targets[0].id, 4);
      w.orderSalvo(ffg, targets[1].id, 4);
      ordered = true;
    }
  }
  const fmt = (o) => `${o.name} ${(o.damage * 100).toFixed(0)}%${o.dead ? " SUNK" : ""}`;
  const all = [...w.objects.values()].filter((o) => o.kind === "ship");
  check("Full scenario runs without errors", true, `t=${(w.t / 60).toFixed(1)} min, ${all.map(fmt).join("; ")}`);
  results.events = w.events.map((e) => `${(e.t / 60).toFixed(1).padStart(5)}m [${e.side}] ${e.text}`);
  lines.push("", "Event log:", ...results.events);
}

document.getElementById("out").innerHTML = lines.join("\n");
window.results = results;
</script>
</body>
</html>
