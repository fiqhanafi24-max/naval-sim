<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sim checks</title>
<style>body { font: 13px/1.4 ui-monospace, monospace; background: #fff; color: #111; padding: 16px; } .fail { color: #b00; } .pass { color: #070; }</style>
</head>
<body>
<h1>Simulation checks</h1>
<pre id="out">running…</pre>
<script type="module">
import { World, ammoLeft } from "../src/sim/world.js";
import { Missile } from "../src/sim/missile.js";
import { DEG, offset, range3D_m } from "../src/sim/geo.js";
import { blastOverpressure, damageFactor } from "../src/sim/damage.js";

const [data, atmo, scenario] = await Promise.all([
  fetch("../data/gcb-units.json").then((r) => r.json()),
  fetch("../data/atmosphere.csv").then((r) => r.text()),
  fetch("../scenarios/norwegian-sea.json").then((r) => r.json()),
]);

const lines = [];
const results = { checks: [] };
function check(name, ok, detail = "") {
  results.checks.push({ name, ok, detail });
  lines.push(`<span class="${ok ? "pass" : "fail"}">${ok ? "PASS" : "FAIL"}</span> ${name} ${detail}`);
}

// 1. Radar horizon: SPY-1D vs a ship should see ~30 km but not 60 km
{
  const w = new World(data, atmo, { seed: 1, units: [
    { side: "blue", class: "Arleigh Burke DDGHM", lat_deg: 60, lon_deg: 0, heading_deg: 0, speed_kts: 0 },
    { side: "red", class: "Pr 956 Sarych", lat_deg: 60 + 25 / 111.2, lon_deg: 0, heading_deg: 90, speed_kts: 0 },
  ] });
  const [b, r] = w.ships();
  const spy = b.radars.find((x) => x.db.name === "SPY-1D");
  const at25 = spy.canDetect(r, false);
  r.lat = (60 + 60 / 111.2) * DEG;
  const at60 = spy.canDetect(r, false);
  check("SPY-1D detects a destroyer at 25 km, not at 60 km (radar horizon)", at25 && !at60, `25km=${at25} 60km=${at60}`);
}

// 2. Harpoon flight: reaches ~Mach 0.85 and holds sea-skimming altitude
{
  const w = new World(data, atmo, { seed: 2, ai: { red: { autoDefend: false, guns: false } }, units: [
    { side: "blue", class: "Arleigh Burke DDGHM", lat_deg: 60, lon_deg: 0, heading_deg: 0, speed_kts: 0 },
    { side: "red", class: "Pr 956 Sarych", lat_deg: 60 + 80 / 111.2, lon_deg: 0, heading_deg: 90, speed_kts: 0 },
  ] });
  const [b, r] = w.ships();
  w.updateTrack("blue", r, "test");
  const idx = b.launchers.findIndex((l) => l.item.includes("Harpoon"));
  const res = w.launch(b, idx, r.id);
  const m = res.missile;
  let maxAlt = 0, speedAt60 = 0, outcome = "flying";
  for (let i = 0; i < 6000 && !m.dead; i++) {
    w.step(0.1);
    if (w.t > 30) maxAlt = Math.max(maxAlt, m.alt);
    if (Math.abs(w.t - 60) < 0.05) speedAt60 = m.speed_mps;
  }
  outcome = r.damage > 0 ? `hit, target damage ${(r.damage * 100).toFixed(0)}%` : "no damage";
  check("Harpoon launches", res.ok, res.reason || "");
  check("Harpoon cruise speed 250-300 m/s", speedAt60 > 250 && speedAt60 < 300, `${speedAt60.toFixed(0)} m/s`);
  check("Harpoon stays below its 800 m terminal pop-up", maxAlt < 900, `max alt after 30 s ${maxAlt.toFixed(0)} m`);
  check("Harpoon reaches stationary target at 80 km", r.damage > 0, outcome + ` t=${w.t.toFixed(0)}s`);
}

// 3. SAM intercept: SM-2 vs an inbound SS-N-22
{
  let kills = 0, n = 20;
  for (let s = 0; s < n; s++) {
    const w = new World(data, atmo, { seed: 100 + s, ai: { blue: { autoDefend: true }, red: {} }, units: [
      { side: "blue", class: "Arleigh Burke DDGHM", lat_deg: 60, lon_deg: 0, heading_deg: 0, speed_kts: 15 },
      { side: "red", class: "Pr 956 Sarych", lat_deg: 60 + 70 / 111.2, lon_deg: 0, heading_deg: 90, speed_kts: 0 },
    ] });
    const [b, r] = w.ships();
    w.updateTrack("red", b, "test");
    const idx = r.launchers.findIndex((l) => l.item.includes("Moskit"));
    const res = w.launch(r, idx, b.id);
    for (let i = 0; i < 3000 && !res.missile.dead; i++) w.step(0.1);
    if (b.damage === 0) kills++;
  }
  check("Burke survives a single SS-N-22 most of the time", kills >= n * 0.5, `${kills}/${n} defended`);
}

// 3b. SS-N-22 against an undefended, moving destroyer, with a trace of the last 8 seconds
{
  let hits = 0, n = 10;
  const outcomes = [];
  let trace = [];
  for (let s = 0; s < n; s++) {
    const w = new World(data, atmo, { seed: 200 + s, ai: { blue: { autoDefend: false, guns: false }, red: {} }, units: [
      { side: "blue", class: "Arleigh Burke DDGHM", lat_deg: 60, lon_deg: 0, heading_deg: 90, speed_kts: 20 },
      { side: "red", class: "Pr 956 Sarych", lat_deg: 60 + 70 / 111.2, lon_deg: 0, heading_deg: 90, speed_kts: 0 },
    ] });
    const [b, r] = w.ships();
    w.updateTrack("red", b, "test", 2000);
    const m = w.launch(r, r.launchers.findIndex((l) => l.item.includes("Moskit")), b.id).missile;
    const rows = [];
    for (let i = 0; i < 3000 && !m.dead; i++) {
      w.step(0.1);
      if (i % 5 === 0) {
        rows.push(`t=${w.t.toFixed(1)} seg=${m.segment} seeker=${m.seekerMode} alt=${m.alt.toFixed(0)}m pitch=${(m.pitch / DEG).toFixed(0)}° goalAlt=${m.goalAlt === -9999 ? "intercept" : m.goalAlt.toFixed(0)} range=${(range3D_m(m, b) / 1000).toFixed(2)}km speed=${m.speed_mps.toFixed(0)}`);
      }
    }
    if (b.damage > 0) hits++;
    outcomes.push(w.events.filter((e) => e.side === "red" && /Moskit/.test(e.text)).map((e) => e.text).slice(-1)[0] || "no event");
    if (s === 0) trace = rows.slice(-16);
  }
  check("SS-N-22 hits an undefended destroyer most of the time", hits >= n * 0.6, `${hits}/${n} hit`);
  lines.push("", "SS-N-22 outcomes: " + outcomes.join(" | "), "SS-N-22 trace (first run, last 8 s):", ...trace, "");
}

// 3c. Close-in weapons only: Burke with its SAMs emptied against single SS-N-22s
{
  let defended = 0, bursts = 0, n = 10;
  for (let s = 0; s < n; s++) {
    const w = new World(data, atmo, { seed: 300 + s, units: [
      { side: "blue", class: "Arleigh Burke DDGHM", lat_deg: 60, lon_deg: 0, heading_deg: 0, speed_kts: 15 },
      { side: "red", class: "Pr 956 Sarych", lat_deg: 60 + 70 / 111.2, lon_deg: 0, heading_deg: 90, speed_kts: 0 },
    ] });
    const [b, r] = w.ships();
    for (const L of b.launchers) if (L.kind === "missile") L.count = 0;
    const ammo = () => b.launchers.filter((L) => L.item.startsWith("20mm")).reduce((a, L) => a + L.count, 0);
    const before = ammo();
    w.updateTrack("red", b, "test");
    const m = w.launch(r, r.launchers.findIndex((l) => l.item.includes("Moskit")), b.id).missile;
    for (let i = 0; i < 3000 && !m.dead; i++) w.step(0.1);
    bursts += before - ammo();
    if (b.damage === 0) defended++;
  }
  check("Phalanx fires at inbound SS-N-22s", bursts > 0, `${bursts} bursts fired over ${n} runs`);
  lines.push(`INFO Phalanx alone stopped ${defended}/${n} SS-N-22s`);
}

// 3d. Gun duel: Burke and Sovremenny 15 km apart, missiles emptied
{
  const w = new World(data, atmo, { seed: 400, units: [
    { side: "blue", class: "Arleigh Burke DDGHM", lat_deg: 60, lon_deg: 0, heading_deg: 90, speed_kts: 10 },
    { side: "red", class: "Pr 956 Sarych", lat_deg: 60 + 15 / 111.2, lon_deg: 0, heading_deg: 270, speed_kts: 10 },
  ] });
  const [b, r] = w.ships();
  for (const ship of [b, r]) for (const L of ship.launchers) if (L.kind === "missile") L.count = 0;
  for (let i = 0; i < 3000; i++) w.step(0.1);
  const fired = (ship) => ship.launchers.filter((L) => L.kind === "gun" && /mm (mk|F-44)/.test(L.item)).map((L) => `${L.item.split(" ")[0]}: ${L.count} left`).join(", ");
  check("Deck guns hit at 15 km", b.damage > 0 || r.damage > 0, `after 5 min: Burke ${(b.damage * 100).toFixed(0)}%, Sovremenny ${(r.damage * 100).toFixed(0)}% (${fired(b)} | ${fired(r)})`);
}

// 4. Damage tables
check("Blast overpressure falls with range", blastOverpressure(10, 100) > blastOverpressure(50, 100));
check("Damage table interpolates", Math.abs(damageFactor([[0, 0], [10, 1]], 5) - 0.5) < 1e-6);

// 5. SAMs against aircraft: an Il-38 orbiting over a Burke
{
  const w = new World(data, atmo, { seed: 500, units: [
    { side: "blue", class: "Arleigh Burke DDGHM", lat_deg: 60, lon_deg: 0, heading_deg: 0, speed_kts: 10 },
  ], air: [
    { side: "red", class: "Il-38", name: "Il-38 test", lat_deg: 60.4, lon_deg: 0, alt_m: 6000, heading_deg: 180,
      home: { lat_deg: 62, lon_deg: 0 }, mission: { type: "patrol", center: { lat_deg: 60, lon_deg: 0 }, radius_km: 15, alt_m: 6000 } },
  ] });
  for (let i = 0; i < 3000; i++) w.step(0.1);
  const lost = w.events.some((e) => /has been shot down/.test(e.text));
  check("SAMs shoot down a patrol aircraft overhead", lost, w.events.filter((e) => /has been shot down|engaging Il-38/.test(e.text)).map((e) => e.text).slice(0, 3).join(" | "));
}

// 6. Full scenario: blue attacks a Sovremenny with ship Harpoons and the Hornet strike together
{
  const w = new World(data, atmo, scenario);
  let ordered = false;
  let firstContact = null;
  for (let i = 0; i < 36000 && !w.over; i++) {
    w.step(0.1);
    const shipTracks = [...w.tracks.blue.values()].filter((t) => t.kind === "ship" && t.error_m === 0);
    if (firstContact == null && shipTracks.length) firstContact = w.t;
    if (!ordered && shipTracks.length >= 3) {
      const target = shipTracks.find((t) => t.className === "Pr 956 Sarych");
      w.callStrike("blue", 0, target.id);
      ordered = w.orderGroupSalvo("blue", target.id, 4).ok;
    }
  }
  const fmt = (o) => `${o.name} ${(o.damage * 100).toFixed(0)}%${o.dead ? " SUNK" : ""}`;
  const all = [...w.objects.values()].filter((o) => o.kind === "ship");
  check("Full scenario runs without errors", true, `t=${(w.t / 60).toFixed(1)} min, ${all.map(fmt).join("; ")}`);
  const count = (re) => w.events.filter((e) => re.test(e.text)).length;
  const asmFired = w.events.reduce((n, e) => n + Number((e.text.match(/fired (\d+) x/) || [0, 0])[1]), 0);
  const samsFired = count(/engaging (inbound missile|.*with)/);
  check("P-3C radar finds the enemy group within 10 minutes", firstContact != null && firstContact < 600, firstContact == null ? "never" : `${(firstContact / 60).toFixed(1)} min`);
  check("Blue's coordinated attack launches from all three ships (no 'salvo stopped')", count(/salvo stopped/) === 0 && count(/^USS .* fired \d+ x/) === 3, `${asmFired} anti-ship missiles fired in total`);
  check("Hornet strike reaches launch range and fires", count(/^Hornet 1 \d fired/) > 0, `${count(/^Hornet 1 \d fired/)} aircraft fired`);
  check("Tu-22M raid reaches launch range and fires", count(/^Backfire \d fired/) > 0, `${count(/^Backfire \d fired/)} aircraft fired`);
  const intercepts = count(/intercepted/);
  lines.push(`INFO Scenario outcome: ${all.filter((o) => o.damage > 0).map(fmt).join("; ") || "no ship damaged"}; ${intercepts} missiles intercepted; ${count(/has been shot down/)} aircraft shot down`);
  check("SAM expenditure is reasonable (at most 4 per anti-ship missile)", samsFired <= 4 * asmFired, `${samsFired} SAMs vs ${asmFired} anti-ship missiles`);
  check("Surface contacts aren't re-announced every radar sweep", count(/New contact/) <= 8, `${count(/New contact/)} 'New contact' events`);
  results.events = w.events.map((e) => `${(e.t / 60).toFixed(1).padStart(5)}m [${e.side}] ${e.text}`);
  lines.push("", "Event log:", ...results.events);
}

// 7. Historical scenarios: run each to its time limit with a simple blue plan
for (const id of ["falklands-1982", "sidra-1986"]) {
  const sc = await fetch(`../scenarios/${id}.json`).then((r) => r.json());
  const w = new World(data, atmo, sc);
  let attacked = false;
  const start = {};
  for (const s of w.ships("blue")) start[s.id] = Object.fromEntries(s.launchers.map((L, i) => [i, ammoLeft(s, L)]));
  for (let i = 0; i < (sc.endAt_s + 1) * 10 && !w.over; i++) {
    w.step(0.1);
    const tr = [...w.tracks.blue.values()].find((t) => t.kind === "ship");
    if (!attacked && tr) {
      attacked = true;
      w.callStrike("blue", 0, tr.id);
      w.orderGroupSalvo("blue", tr.id, 4);
    }
  }
  const count = (re) => w.events.filter((e) => re.test(e.text)).length;
  const ships = [...w.objects.values()].filter((o) => o.kind === "ship");
  const fmt = (o) => `${o.name} ${(o.damage * 100).toFixed(0)}%${o.dead ? " SUNK" : ""}`;
  check(`${sc.name}: runs to the end without errors`, !!w.over, `ended at ${(w.t / 60).toFixed(0)} min`);
  if (id === "falklands-1982") {
    check("Falklands: Super Étendards fire their Exocets", count(/^Super Étendard.* fired \d+ x AM-39/) > 0, `${count(/fired \d+ x AM-39/)} aircraft fired`);
    const seaDart = w.ships("blue").concat(ships.filter((o) => o.side === "blue" && o.dead))
      .filter((s) => s.db.name.startsWith("Type 42"))
      .map((s) => start[s.id][0] - ammoLeft(s, s.launchers[0]));
    lines.push(`INFO Falklands: Sea Darts fired per Type 42: ${seaDart.join(", ")}`);
  } else {
    check("Sidra: Nanuchkas fire SS-N-2C Styx", count(/fired \d+ x P-15M/) > 0, `${count(/fired \d+ x P-15M/)} salvos`);
    check("Sidra: A-6E Intruders fire Harpoons", count(/^Intruder \d fired/) > 0, `${count(/^Intruder \d fired/)} aircraft fired`);
  }
  lines.push(`INFO ${sc.name} outcome: ${ships.map(fmt).join("; ")}; ${count(/intercepted/)} missiles intercepted`);
  lines.push(`--- ${sc.name} event log`, ...w.events.map((e) => `${(e.t / 60).toFixed(1).padStart(5)}m [${e.side}] ${e.text}`), "");
}

document.getElementById("out").innerHTML = lines.join("\n");
window.results = results;
</script>
</body>
</html>
